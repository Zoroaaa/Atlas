# Worker 名（2026-11-11 由 codeseek-backend 改名为 atlas，面板同步改过）。
# wrangler 按此名定位脚本：与面板不一致时会部署到另一个 Worker，出现"部署成功但流量没变"。
# 自定义域、cron、D1 绑定、secrets 都挂在服务上，改名后仍跟随；D1 的 database_name 保持不变。
name = "atlas"
main = "src/index.ts"
# 必须 ≥ 2025-04-01：低于该版本的导航请求默认会进入 Worker，
# 与静态资源 SPA 回退配合时会导致深链直接刷新返回 JSON 404
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
preview_urls = false

# =====================================================================
# [vars] — Layer 1: 部署级配置
# 职责：换域名/换环境时需要不同值的基础设施参数
# 修改方式：编辑此文件后重新部署
# 注意：敏感密钥（JWT_SECRET, RESEND_API_KEY）通过 `wrangler secret put` 注入，
#       不得出现在此文件中
# =====================================================================
[vars]

# 应用版本（展示用：/api、/api/system/version；代码兜底 1.9.0）
APP_VERSION = "1.9.0"

# 站点主地址 — 邮件模板里的「访问站点」链接、反馈通知页脚
# 必须与真实访问域一致，否则邮件里的链接指向错误页面
SITE_URL = "https://atlas.wort.uk"

# R2 封面公网域名 — 先在 R2 面板创建 atlas-media bucket 并绑定该自定义域，
# 未配置时代理会从 R2 直出字节（功能不受影响，但没有 CDN 加速）
MEDIA_PUBLIC_BASE = "https://img.atlas.wort.uk"

# 前端域名 — OAuth 回调后跳转目标
FRONTEND_URL = "https://atlas.wort.uk"

# 后端 API 域名 — 用于 OAuth callback URI 构造；前端已同源，API 不再单独用子域
BACKEND_URL = "https://atlas.wort.uk"

# Cloudflare 发件人 — 绑定 Cloudflare Email Sending 的已 onboard 域名，改了必须重新部署
# 其它服务商使用各自的发件子域名（在 backend/src/services/email-sender.ts 中固定绑定）
DEFAULT_FROM_EMAIL = "noreply@mail.wort.uk"
DEFAULT_FROM_NAME = "Atlas"

# JWT 过期天数 — 安全策略，属于环境级决策
JWT_EXPIRY_DAYS = "30"

# 用户行为日志 — 生产/开发环境可能不同，属于环境级开关
ENABLE_ACTION_LOGGING = "true"

# GitHub Actions 调度：仓库固定；PAT 通过 wrangler secret 注入（GITHUB_DISPATCH_TOKEN）
# Worker 每 30 分钟 dispatch follow-upcoming-sync.yml，弥补 GitHub 原生 schedule 的延迟/跳过
GITHUB_REPOSITORY = "Zoroaaa/Atlas"
GITHUB_DISPATCH_REF = "main"

# AI 别名候选生成（旁路）：默认关闭；开启前需在下方声明 [ai] binding 并部署
ENABLE_ALIAS_AI = "0"
# 可选：覆盖默认翻译模型
# ALIAS_AI_MODEL = "@cf/meta/m2m100-1.2b"

# =====================================================================
# 以下配置通过 `wrangler secret put` 注入（不得写入此文件中）：
# 🔐 JWT_SECRET
# 🔐 RESEND_API_KEY
# 🔐 MAILTRAP_API_TOKEN     (Mailtrap Email Sending API Token，可选)
# 🔐 MAILTRAP_API_URL       (可选：默认 https://send.api.mailtrap.io/api/send)
# 🔐 BREVO_API_KEY          (Brevo Transactional Email API Key，可选)
# 🔐 TMDB_API_KEY            (影视元数据搜索，缺失时该来源静默跳过)
# 🔐 GITHUB_CLIENT_ID        (GitHub OAuth App Client ID)
# 🔐 GITHUB_CLIENT_SECRET    (GitHub OAuth App Client Secret)
# 🔐 GOOGLE_CLIENT_ID        (Google OAuth 2.0 Client ID, Google Cloud Console 创建)
# 🔐 GOOGLE_CLIENT_SECRET    (Google OAuth 2.0 Client Secret)
# 🔐 RANKINGS_IMPORT_SECRET  (GitHub Actions 调用 /api/internal/rankings/import)
# 🔐 GITHUB_DISPATCH_TOKEN   (PAT actions:write，用于每 30 分钟 dispatch 关注同步 workflow)
# =====================================================================

# 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "codeseek"
database_id = "42216a7e-3dbb-4feb-9974-2a8ee32af550"

# R2 封面缓存
# 部署前必须先在账号内创建 bucket：wrangler r2 bucket create atlas-media
# 否则 wrangler deploy 会直接失败。本地 wrangler dev 使用本地模拟器，不要求远端 bucket 存在。
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "atlas-media"
# wrangler dev --remote 时才需要
# preview_bucket_name = "atlas-media-preview"

# Cloudflare Email Service（Workers Paid 的 Email Sending）
# 发送域名需先在 Cloudflare 面板 Compute → Email Service → Email Sending 完成 onboard。
# 未配置或被管理端切换为 Resend 时不会使用该绑定。
[[send_email]]
name = "EMAIL"

# Workers AI（可选）：启用 ENABLE_ALIAS_AI 时取消注释。
# 账号未开通 Workers AI 时保留注释，否则部署会失败。
# [ai]
# binding = "AI"

# 监控
[observability]
enabled = true

[triggers]
# 关注检测 + 邮件摘要每 30 分钟一轮；小时任务固定在 :05，避免整点争抢 D1 写；
# * * * * * 用于管理看板手动触发的 JAV 详情补全批次（Cloudflare 免费计划上限 5 个 cron）
crons = ["5 * * * *", "*/30 * * * *", "* * * * *"]

# =====================================================================
# [assets] — 前端静态资源（与 API 同一个 Worker）
# directory 相对本文件所在目录（backend/），即仓库根的 frontend/dist
# run_worker_first 必须同时列裸路径与通配符：/api/* 不匹配 /api 本身，
# 而 /api 由 systemRoutes 提供（GET /api/health 等），漏了会返回 index.html
# 前端导航路径不要放进 run_worker_first：会消耗 Worker 请求配额且超限直接 429
# =====================================================================
[assets]
directory = "../frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api", "/api/*"]
