# Worker 名（2026-11-11 由 codeseek-backend 改名为 atlas，面板同步改过）。
# wrangler 按此名定位脚本：与面板不一致时会部署到另一个 Worker，出现"部署成功但流量没变"。
# 自定义域、cron、D1 绑定、secrets 都挂在服务上，改名后仍跟随；D1 的 database_name 保持不变。
name = "atlas"
main = "src/index.ts"
# 必须 ≥ 2025-04-01：低于该版本的导航请求默认会进入 Worker，
# 与静态资源 SPA 回退配合时会导致深链直接刷新返回 JSON 404
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
preview_urls = false

# =====================================================================
# [vars] — Layer 1: 部署级配置
# 职责：换域名/换环境时需要不同值的基础设施参数
# 修改方式：编辑此文件后重新部署
# 注意：敏感密钥（JWT_SECRET, RESEND_API_KEY）通过 `wrangler secret put` 注入，
#       不得出现在此文件中
# =====================================================================
[vars]

# 应用版本（展示用：/api、/api/system/version；代码兜底 1.8.0）
APP_VERSION = "1.8.0"

# 站点主地址 — 邮件模板里的「访问站点」链接、反馈通知页脚
# 必须与真实访问域一致，否则邮件里的链接指向错误页面
SITE_URL = "https://atlas.wort.uk"

# 前端域名 — OAuth 回调后跳转目标
FRONTEND_URL = "https://atlas.wort.uk"

# 后端 API 域名 — 用于 OAuth callback URI 构造；前端已同源，API 不再单独用子域
BACKEND_URL = "https://atlas.wort.uk"

# 邮件发件人 — 与邮件服务商域名验证绑定，改了必须重新部署
DEFAULT_FROM_EMAIL = "noreply@mail.wort.uk"
DEFAULT_FROM_NAME = "Atlas"

# JWT 过期天数 — 安全策略，属于环境级决策
JWT_EXPIRY_DAYS = "30"

# 用户行为日志 — 生产/开发环境可能不同，属于环境级开关
ENABLE_ACTION_LOGGING = "true"

# AI 别名候选生成（旁路）：默认关闭；开启前需在下方声明 [ai] binding 并部署
ENABLE_ALIAS_AI = "0"
# 可选：覆盖默认翻译模型
# ALIAS_AI_MODEL = "@cf/meta/m2m100-1.2b"

# =====================================================================
# 以下配置通过 `wrangler secret put` 注入（不得写入此文件中）：
# 🔐 JWT_SECRET
# 🔐 RESEND_API_KEY
# 🔐 TMDB_API_KEY            (影视元数据搜索，缺失时该来源静默跳过)
# 🔐 GITHUB_CLIENT_ID        (GitHub OAuth App Client ID)
# 🔐 GITHUB_CLIENT_SECRET    (GitHub OAuth App Client Secret)
# 🔐 GOOGLE_CLIENT_ID        (Google OAuth 2.0 Client ID, Google Cloud Console 创建)
# 🔐 GOOGLE_CLIENT_SECRET    (Google OAuth 2.0 Client Secret)
# 🔐 RANKINGS_IMPORT_SECRET  (GitHub Actions 调用 /api/internal/rankings/import)
# =====================================================================

# 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "codeseek"
database_id = "42216a7e-3dbb-4feb-9974-2a8ee32af550"

# Workers AI（可选）：启用 ENABLE_ALIAS_AI 时取消注释。
# 账号未开通 Workers AI 时保留注释，否则部署会失败。
# [ai]
# binding = "AI"

# 监控
[observability]
enabled = true

[triggers]
# 小时任务错开 :05，避免与 */30 的 :00 轮次在同一分钟抢 D1 写；
# * * * * * 用于管理看板手动触发的 JAV 详情补全批次（Cloudflare 免费计划上限 5 个 cron）
crons = ["5 * * * *", "*/30 * * * *", "* * * * *"]

# =====================================================================
# [assets] — 前端静态资源（与 API 同一个 Worker）
# directory 相对本文件所在目录（backend/），即仓库根的 frontend/dist
# run_worker_first 必须同时列裸路径与通配符：/api/* 不匹配 /api 本身，
# 而 /api 由 systemRoutes 提供（GET /api/health 等），漏了会返回 index.html
# 前端导航路径不要放进 run_worker_first：会消耗 Worker 请求配额且超限直接 429
# =====================================================================
[assets]
directory = "../frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api", "/api/*"]
