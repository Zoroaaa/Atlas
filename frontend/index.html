    <style>
      /* 首屏启动占位：React 挂载前避免白/黑屏，挂载时随 #root 一起被替换 */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fafaf9;
      }
      html.dark #boot-splash {
        background: #0a0a0b;
      }
      .boot-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
      }
      .boot-ring {
        transform-origin: 52px 52px;
        animation: boot-spin 1.4s linear infinite;
      }
      .boot-bar {
        width: 120px;
        height: 2px;
        border-radius: 2px;
        overflow: hidden;
        background: rgba(212, 168, 83, 0.16);
      }
      .boot-bar span {
        display: block;
        width: 45%;
        height: 100%;
        background: linear-gradient(90deg, transparent, #d4a853, transparent);
        animation: boot-slide 1.15s ease-in-out infinite;
      }
      .boot-text {
        font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
        font-size: 12px;
        letter-spacing: 0.42em;
        color: #a8a29e;
      }
      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes boot-slide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-ring, .boot-bar span { animation: none; }
      }
    </style>
    <script>
      (function() {
        try {
          const theme = JSON.parse(localStorage.getItem('theme-storage') || '{}');
          if (theme?.state?.resolvedTheme === 'dark' || 
              (!theme?.state?.resolvedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash">
        <div class="boot-inner">
          <svg width="112" height="112" viewBox="0 0 104 104" fill="none" aria-hidden="true">
            <defs>

                <stop offset="0.55" stop-color="#d4a853" />
                <stop offset="1" stop-color="#e11d48" />
              </linearGradient>
              <radialGradient id="bootHalo" cx="50%" cy="50%" r="50%">
                <stop stop-color="#d4a853" stop-opacity="0.26" />
                <stop offset="1" stop-color="#d4a853" stop-opacity="0" />
              </radialGradient>
            </defs>
            <circle cx="52" cy="52" r="44" fill="url(#bootHalo)" />
            <circle class="boot-ring" cx="52" cy="52" r="30.5" stroke="url(#bootGold)" stroke-width="1.2"
              stroke-linecap="round" stroke-dasharray="62 130" />
            <circle cx="52" cy="52" r="27.6" stroke="#d4a853" stroke-opacity="0.22" stroke-width="0.5" />
            <g stroke="url(#bootGold)" stroke-linecap="round">
              <line x1="52" y1="18.3" x2="52" y2="21.9" stroke-width="0.8" />
              <line x1="52" y1="82.1" x2="52" y2="85.7" stroke-width="0.8" />
              <line x1="18.3" y1="52" x2="21.9" y2="52" stroke-width="0.8" />
              <line x1="82.1" y1="52" x2="85.7" y2="52" stroke-width="0.8" />
            </g>
            <polygon points="52,24 56.7,50.8 52,48.1 47.3,50.8" fill="url(#bootGold)" />
            <polygon points="52,80 56.7,53.2 52,55.9 47.3,53.2" fill="#e11d48" opacity="0.68" />
            <circle cx="52" cy="52" r="2" fill="#d4a853" />
            <circle cx="52" cy="52" r="0.85" fill="#0a0a0b" />
          </svg>
          <div class="boot-bar"><span></span></div>
          <div class="boot-text">ATLAS</div>
        </div>
      </div>
