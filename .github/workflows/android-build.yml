name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'frontend/**'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Android APK

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          # Capacitor 8 CLI 要求 Node >= 22
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 工作区链接（@codeseek/shared）依赖根目录安装
      - name: Install Root Dependencies
        run: npm install

      # Capacitor 的 webDir 指向 frontend/dist，sync 前必须先构建
      - name: Build Frontend
        run: npm run build --workspace=frontend

      - name: Install Mobile Dependencies
        working-directory: mobile
        run: npm install

      # android/ 不入库，每次由模板生成，避免仓库携带 Gradle 产物
      - name: Add Android Platform
        working-directory: mobile
        run: npx cap add android

      - name: Generate Android Icons
        working-directory: mobile
        run: npx capacitor-assets generate --android

      - name: Sync Web Assets
        working-directory: mobile
        run: npx cap sync android

      # 版本号从根 package.json 注入；配置了签名 Secrets 时同时写入 signingConfig
      - name: Prepare Android Project
        working-directory: mobile
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/atlas-release.p12"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/atlas-release.p12" >> "$GITHUB_ENV"
          fi
          node scripts/prepare-android.mjs

      # 有签名密钥时出 release APK，否则回退 debug（可直接侧载，但无法覆盖升级）
      - name: Build APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Collect APK
        run: |
          mkdir -p build-output
          if [ -f mobile/android/app/build/outputs/apk/release/app-release.apk ]; then
            cp mobile/android/app/build/outputs/apk/release/app-release.apk build-output/Atlas-Android-release.apk
          else
            cp mobile/android/app/build/outputs/apk/debug/app-debug.apk build-output/Atlas-Android-debug.apk
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: atlas-android
          path: build-output/*.apk
          if-no-files-found: error
