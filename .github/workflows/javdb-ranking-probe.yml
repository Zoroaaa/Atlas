name: JavDB Ranking Probe

# P3-0 探测：只验证 GitHub Actions 出口能否拿到 JavDB 月榜 JSON。
# 手动运行；不写库、不调导入接口。成功后才继续 P3。

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install javdb-cli
        run: |
          go install github.com/FlanChanXwO/javdb-cli/cmd/javdb@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Show version and ranking flags
        run: |
          javdb --version
          javdb rankings movies --help

      - name: Fetch weekly and monthly rankings
        shell: bash
        run: |
          set -o pipefail

          fetch() {
            local type="$1"
            local period="$2"
            local out="${type}-${period}.json"
            echo "=== ${type} / ${period} ==="
            if javdb rankings movies --type "$type" --period "$period" --json > "$out" 2> "${out}.err"; then
              echo "${type}/${period}: auto host ok"
            else
              echo "${type}/${period}: auto host failed, retry mirror"
              javdb rankings movies --type "$type" --period "$period" --json --host mirror > "$out" 2>> "${out}.err"
            fi
            echo "--- ${type}/${period} stderr (tail) ---"
            tail -n 30 "${out}.err" || true
            echo "--- ${type}/${period} stdout (head) ---"
            head -c 2000 "$out" || true
            echo
          }

          for period in week month; do
            for type in censored uncensored; do
              fetch "$type" "$period"
            done
          done

      - name: Assert JSON contains rankable codes
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');

          const files = [
            'censored-week.json',
            'uncensored-week.json',
            'censored-month.json',
            'uncensored-month.json',
          ];
          const minCodes = { censored: 10, uncensored: 5 };
          let failed = false;

          for (const file of files) {
            if (!fs.existsSync(file)) {
              console.error(`${file}: missing`);
              failed = true;
              continue;
            }

            let data;
            try {
              data = JSON.parse(fs.readFileSync(file, 'utf8'));
            } catch (err) {
              console.error(`${file}: invalid JSON: ${err.message}`);
              failed = true;
              continue;
            }

            const codes = new Set();
            const walk = (value) => {
              if (typeof value === 'string') {
                const trimmed = value.trim();
                // 宽识别：标准/日期/下划线/多段番号都算有效样例
                if (/^[A-Z0-9]{2,10}([-_][A-Z0-9]{1,10}){1,3}$/i.test(trimmed)) {
                  codes.add(trimmed.toUpperCase());
                }
                return;
              }
              if (Array.isArray(value)) {
                value.forEach(walk);
                return;
              }
              if (value && typeof value === 'object') {
                Object.values(value).forEach(walk);
              }
            };
            walk(data);

            const section = file.includes('uncensored') ? 'uncensored' : 'censored';
            console.log(`${file}: unique codes = ${codes.size}`);
            if (codes.size < minCodes[section]) failed = true;
          }

          if (failed) {
            console.error('PROBE FAILED: not enough rankable codes or invalid output');
            process.exit(1);
          }
          console.log('PROBE PASSED');
          NODE

      - name: Upload probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: javdb-ranking-probe
          path: |
            censored-week.json
            censored-week.json.err
            uncensored-week.json
            uncensored-week.json.err
            censored-month.json
            censored-month.json.err
            uncensored-month.json
            uncensored-month.json.err
          if-no-files-found: warn
          retention-days: 7
