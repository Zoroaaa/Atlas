name: Deploy to Cloudflare Workers

on:
  # 部署入口已迁移到 Cloudflare Workers Builds（连接 GitHub，push 自动构建部署）。
  # 这里保留 workflow_dispatch 作为应急手动部署入口，避免两条流水线同时部署互相覆盖。
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Backend to ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies (Monorepo Root)
        run: npm install

      - name: Type Check
        run: npm run typecheck --workspace=backend

      - name: Lint
        run: npm run lint --workspace=backend

      # Worker 现在同时托管前端静态资源，部署前必须先生成 frontend/dist
      - name: Build Frontend (Static Assets)
        run: npm run build --workspace=frontend

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ./backend
          command: deploy
        env:
          WRANGLER_VERSION: 4
      

